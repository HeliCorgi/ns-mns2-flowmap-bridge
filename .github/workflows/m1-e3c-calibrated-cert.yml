name: M-1 E3c calibrated near-far certification

on:
  pull_request:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  certify:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'numerics/m1-e3c-calibrated-cert'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact source artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          expected = [
              (9994071254, 'm1-filter-calibration-envelope', 'sha256:6d6ca58697a1659d814dc5ae9736e105847ebdd690423d5233997f547129506e'),
              (9984447543, 'm1-E3c96-nearfar-rescue', 'sha256:445c4cbbb0c9431a2d1bc14cc589b01d06941b733569576b5c0310b02975ada7'),
              (9984844033, 'm1-E3c128-nearfar-rescue', 'sha256:8f0722332854e022c3a0976d015e46ee4a36fda0a0c2158235148ee2b422970e'),
          ]
          for aid, name, digest in expected:
              url = f'https://api.github.com/repos/HeliCorgi/ns-mns2-flowmap-bridge/actions/artifacts/{aid}'
              req = urllib.request.Request(url, headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              with urllib.request.urlopen(req) as r:
                  d = json.load(r)
              assert int(d['id']) == aid, d
              assert d['name'] == name, d
              assert not d['expired'], d
              assert d.get('digest') == digest, d
              print(f'provenance PASS id={aid} name={name} digest={digest}')
          PY
      - name: Recover frozen calibration envelope
        uses: actions/download-artifact@v4
        with:
          name: m1-filter-calibration-envelope
          path: experiments/m1_events/results_calibrated_cert/input/envelope
          github-token: ${{ github.token }}
          repository: HeliCorgi/ns-mns2-flowmap-bridge
          run-id: 34049373265
      - name: Recover E3c96 R1
        uses: actions/download-artifact@v4
        with:
          name: m1-E3c96-nearfar-rescue
          path: experiments/m1_events/results_calibrated_cert/input/E3c96
          github-token: ${{ github.token }}
          repository: HeliCorgi/ns-mns2-flowmap-bridge
          run-id: 34017370158
      - name: Recover E3c128 R1
        uses: actions/download-artifact@v4
        with:
          name: m1-E3c128-nearfar-rescue
          path: experiments/m1_events/results_calibrated_cert/input/E3c128
          github-token: ${{ github.token }}
          repository: HeliCorgi/ns-mns2-flowmap-bridge
          run-id: 34017370158
      - name: Apply frozen calibration mechanically
        run: |
          mkdir -p experiments/m1_events/results_calibrated_cert
          python experiments/m1_events/certify_nearfar_with_calibration.py \
            experiments/m1_events/results_calibrated_cert/input/envelope/envelopes.json \
            experiments/m1_events/results_calibrated_cert/input/E3c96/E3c96.json \
            experiments/m1_events/results_calibrated_cert/input/E3c128/E3c128.json \
            experiments/m1_events/results_calibrated_cert/E3c96_vs_E3c128_calibrated.json \
            | tee experiments/m1_events/results_calibrated_cert/E3c96_vs_E3c128_calibrated.txt
      - name: Sanity-check certification output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('experiments/m1_events/results_calibrated_cert/E3c96_vs_E3c128_calibrated.json')
          d = json.loads(p.read_text())
          assert d['classification'].startswith('NUMERICAL OBSERVATION')
          assert d['lo']['name'] == 'E3c96' and int(d['lo']['N']) == 96
          assert d['hi']['name'] == 'E3c128' and int(d['hi']['N']) == 128
          assert d['envelope_reference_pair'] == [160, 192]
          assert len(d['common_positive_global_growth_times']) > 0
          assert d['combos']
          labels = set()
          for row in d['combos'].values():
              for s in row['samples']:
                  labels.add(s['lo']['label']); labels.add(s['hi']['label'])
                  if s['lo']['bin'] == 'B3':
                      assert s['lo']['label'] == 'NUMERICALLY_UNCERTIFIED_RESOLUTION'
                  if s['hi']['bin'] == 'B3':
                      assert s['hi']['label'] == 'NUMERICALLY_UNCERTIFIED_RESOLUTION'
          assert 'INCONSISTENT_MULTIPLE_WINNERS' not in labels
          assert 'NONFINITE_OR_BAD_P' not in labels
          print('calibrated-cert sanity PASS labels=', sorted(labels))
          PY
      - name: Upload calibrated E3c certification
        uses: actions/upload-artifact@v4
        with:
          name: m1-E3c96-E3c128-calibrated-certification
          path: |
            experiments/m1_events/results_calibrated_cert/E3c96_vs_E3c128_calibrated.json
            experiments/m1_events/results_calibrated_cert/E3c96_vs_E3c128_calibrated.txt
          if-no-files-found: error
