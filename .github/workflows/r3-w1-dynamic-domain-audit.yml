name: R3 W1 early dynamic-domain audit

on:
  pull_request:
    branches: ["research/r3-axisym-wholespace-w1-manufactured-v2"]
    paths:
      - "experiments/r3_wholespace_w1/manufactured_short_time.py"
      - "experiments/r3_wholespace_w1/dynamic_domain_audit.py"
      - "docs/gates/R3_AXISYM_WHOLESPACE_W1_DYNAMIC_DOMAIN_*.md"
      - ".github/workflows/r3-w1-dynamic-domain-audit.yml"
  workflow_dispatch:

concurrency:
  group: r3-w1-dynamic-domain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dynamic-domain-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numerical dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile dynamic-domain gate
        run: |
          python -m py_compile \
            experiments/r3_wholespace_w1/manufactured_short_time.py \
            experiments/r3_wholespace_w1/dynamic_domain_audit.py

      - name: Execute frozen dynamic-domain gate
        run: python experiments/r3_wholespace_w1/dynamic_domain_audit.py

      - name: Upload dynamic-domain report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3-w1-dynamic-domain-audit
          path: experiments/r3_wholespace_w1/results/W1_DYNAMIC_DOMAIN_AUDIT.json
          if-no-files-found: warn
