name: R3 candidate-time pilot

on:
  pull_request:
    branches: ["main"]
    paths:
      - "experiments/r3_wholespace_w1/candidate_time_pilot.py"
      - "docs/gates/R3_AXISYM_WHOLESPACE_CANDIDATE_TIME_PILOT_*.md"
      - ".github/workflows/r3-candidate-time-pilot.yml"
  workflow_dispatch:

concurrency:
  group: r3-candidate-time-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate-time-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numerical dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile candidate-time pilot
        run: |
          python -m py_compile \
            experiments/r3_wholespace_w1/manufactured_short_time.py \
            experiments/r3_wholespace_w1/green_quadrature_repair.py \
            experiments/r3_wholespace_w1/dynamic_resolution_audit.py \
            experiments/r3_wholespace_w1/candidate_time_pilot.py

      - name: Execute frozen candidate-time pilot
        run: python experiments/r3_wholespace_w1/candidate_time_pilot.py

      - name: Upload candidate-time pilot report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3-candidate-time-pilot
          path: experiments/r3_wholespace_w1/results/CANDIDATE_TIME_PILOT.json
          if-no-files-found: warn
