name: R3 W1 divergence diagnostic repair

on:
  pull_request:
    branches: ["research/r3-axisym-wholespace-w1-manufactured"]
    paths:
      - "experiments/r3_wholespace_w1/divergence_diagnostic_repair.py"
      - "docs/gates/R3_AXISYM_WHOLESPACE_W1_DIVERGENCE_REPAIR_*.md"
      - ".github/workflows/r3-w1-divergence-repair.yml"
  workflow_dispatch:

concurrency:
  group: r3-w1-divergence-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  divergence-diagnostic-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install NumPy
        run: python -m pip install "numpy>=1.24"

      - name: Compile repair gate
        run: python -m py_compile experiments/r3_wholespace_w1/divergence_diagnostic_repair.py

      - name: Execute frozen repair gate
        run: python experiments/r3_wholespace_w1/divergence_diagnostic_repair.py

      - name: Upload repair report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3-w1-divergence-diagnostic-repair
          path: experiments/r3_wholespace_w1/results/W1_DIVERGENCE_REPAIR.json
          if-no-files-found: warn
