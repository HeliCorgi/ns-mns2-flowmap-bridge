name: R3 shape-family screen

on:
  pull_request:
    branches: ["main"]
    paths:
      - "experiments/r3_wholespace_w1/shape_family_screen.py"
      - "docs/gates/R3_AXISYM_WHOLESPACE_SHAPE_FAMILY_SCREEN_*.md"
      - ".github/workflows/r3-shape-family-screen.yml"
  workflow_dispatch:

concurrency:
  group: r3-shape-family-screen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shape-family-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numerical dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile shape-family screen
        run: |
          python -m py_compile \
            experiments/r3_wholespace_w1/manufactured_short_time.py \
            experiments/r3_wholespace_w1/green_quadrature_repair.py \
            experiments/r3_wholespace_w1/dynamic_resolution_audit.py \
            experiments/r3_wholespace_w1/candidate_time_pilot.py \
            experiments/r3_wholespace_w1/shape_family_screen.py

      - name: Execute frozen shape-family screen
        run: python experiments/r3_wholespace_w1/shape_family_screen.py

      - name: Upload shape-family report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3-shape-family-screen
          path: experiments/r3_wholespace_w1/results/SHAPE_FAMILY_SCREEN.json
          if-no-files-found: warn
