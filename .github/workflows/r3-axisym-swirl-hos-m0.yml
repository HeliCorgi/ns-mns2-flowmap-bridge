name: R3 axisymmetric swirl high-order s M0

on:
  push:
    branches: ["research/r3-axisym-swirl-hofd-method"]
    paths:
      - "experiments/r3_axi_swirl/compact_family.py"
      - "experiments/r3_axi_swirl/free_space_elliptic_prototype.py"
      - "experiments/r3_axi_swirl/check_low_axial_frequency_e0.py"
      - "experiments/r3_axi_swirl/high_order_s_elliptic.py"
      - "experiments/r3_axi_swirl/check_high_order_s_m0.py"
      - ".github/workflows/r3-axisym-swirl-hos-m0.yml"
  workflow_dispatch:

concurrency:
  group: r3-axisym-swirl-hos-m0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manufactured-m0:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numerical dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile HOS M0 stack
        run: |
          python -m py_compile \
            experiments/r3_axi_swirl/compact_family.py \
            experiments/r3_axi_swirl/free_space_elliptic_prototype.py \
            experiments/r3_axi_swirl/check_low_axial_frequency_e0.py \
            experiments/r3_axi_swirl/high_order_s_elliptic.py \
            experiments/r3_axi_swirl/check_high_order_s_m0.py

      - name: Run preregistered high-order s-coordinate M0
        working-directory: experiments/r3_axi_swirl
        run: python check_high_order_s_m0.py

      - name: Upload HOS M0 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3-axisym-swirl-hos-m0-results
          path: experiments/r3_axi_swirl/results_hos_m0/summary.json
          if-no-files-found: warn
