name: R3 axisymmetric swirl seed and E0 prototype

on:
  push:
    branches: ["research/r3-axisym-swirl-candidate-seed"]
    paths:
      - "experiments/r3_axi_swirl/compact_family.py"
      - "experiments/r3_axi_swirl/check_compact_family.py"
      - "experiments/r3_axi_swirl/free_space_elliptic_prototype.py"
      - "experiments/r3_axi_swirl/check_free_space_elliptic.py"
      - "experiments/r3_axi_swirl/check_low_axial_frequency_e0.py"
      - ".github/workflows/r3-axisym-swirl-seed-e0.yml"
  workflow_dispatch:

concurrency:
  group: r3-axisym-swirl-seed-e0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seed-and-elliptic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numerical dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile R3 candidate infrastructure
        run: |
          python -m py_compile \
            experiments/r3_axi_swirl/compact_family.py \
            experiments/r3_axi_swirl/check_compact_family.py \
            experiments/r3_axi_swirl/free_space_elliptic_prototype.py \
            experiments/r3_axi_swirl/check_free_space_elliptic.py \
            experiments/r3_axi_swirl/check_low_axial_frequency_e0.py

      - name: Run preregistered S0 seed audit
        working-directory: experiments/r3_axi_swirl
        run: python check_compact_family.py

      - name: Run nonperiodic E0 manufactured audit
        working-directory: experiments/r3_axi_swirl
        run: python check_free_space_elliptic.py

      - name: Run low-axial-frequency E0 stress
        working-directory: experiments/r3_axi_swirl
        run: python check_low_axial_frequency_e0.py

      - name: Upload S0 and E0 result JSON
        uses: actions/upload-artifact@v4
        with:
          name: r3-axisym-swirl-seed-e0-results
          path: |
            experiments/r3_axi_swirl/results_seed_preflight/summary.json
            experiments/r3_axi_swirl/results_elliptic_e0/summary.json
            experiments/r3_axi_swirl/results_elliptic_e0_lowk/summary.json
          if-no-files-found: error
