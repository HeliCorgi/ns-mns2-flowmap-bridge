name: M-1 E4c128 R0 resolution screen

on:
  pull_request:
    branches: ["numerics/m1-e3c-nearfar-r1r2"]
    paths:
      - ".github/workflows/m1-e4c128-r0.yml"
  workflow_dispatch:

concurrency:
  group: m1-e4c128-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  seed-self-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependencies
        run: python -m pip install -r requirements.txt
      - name: Check fixed-continuum seed construction
        working-directory: experiments/m1_events
        run: python check_resolution_invariant_ic.py

  e4c128-screen:
    needs: seed-self-check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependencies
        run: python -m pip install -r requirements.txt
      - name: Run preregistered E4c128 whole-run R0 screen
        run: python experiments/m1_events/resolution_rescue.py E4c128
      - name: Report scientific gate without converting tail FAIL into CI failure
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          p = Path("experiments/m1_events/results_resolution_rescue/E4c128.json")
          d = json.loads(p.read_text())
          assert d["name"] == "E4c128", d
          assert int(d["N"]) == 128, d
          assert math.isclose(float(d["nu"]), 0.02, rel_tol=0.0, abs_tol=1e-15), d
          assert math.isclose(float(d["T"]), 6.0, rel_tol=0.0, abs_tol=1e-15), d
          assert math.isclose(float(d["dt"]), 1.0/160.0, rel_tol=0.0, abs_tol=1e-15), d
          assert math.isclose(float(d["tail_tolerance"]), 1e-5, rel_tol=0.0, abs_tol=1e-18), d
          print("E4c128 N=128")
          print(f"max_tail={d['max_tail']:.12e}")
          print(f"tail_tolerance={d['tail_tolerance']:.12e}")
          print(f"tail_pass={d['tail_pass']}")
          print(f"finite_pass={d['finite_pass']}")
          print(f"max_relative_single_step_energy_growth={d['max_relative_single_step_energy_growth']:.12e}")
          print(f"walltime_s={d['walltime_s']:.3f}")
          if not d["finite_pass"]:
              raise SystemExit("non-finite numerical state: infrastructure/numerical failure")
          PY
      - name: Upload E4c128 R0 screen artifact
        uses: actions/upload-artifact@v4
        with:
          name: m1-E4c128-resolution-screen
          path: experiments/m1_events/results_resolution_rescue/E4c128.json
          if-no-files-found: error
