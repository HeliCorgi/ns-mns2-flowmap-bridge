name: R3 W1 elliptic discretization-boundary decomposition

on:
  pull_request:
    branches: ["research/r3-axisym-wholespace-w1-green-quadrature-repair"]
    paths:
      - "experiments/r3_wholespace_w1/manufactured_short_time.py"
      - "experiments/r3_wholespace_w1/green_quadrature_repair.py"
      - "experiments/r3_wholespace_w1/elliptic_decomposition.py"
      - "docs/gates/R3_AXISYM_WHOLESPACE_W1_ELLIPTIC_DECOMPOSITION_*.md"
      - ".github/workflows/r3-w1-elliptic-decomposition.yml"
  workflow_dispatch:

concurrency:
  group: r3-w1-elliptic-decomposition-${{ github.ref }}
  cancel-in-progress: true

jobs:
  elliptic-decomposition:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile elliptic decomposition gate
        run: |
          python -m py_compile \
            experiments/r3_wholespace_w1/manufactured_short_time.py \
            experiments/r3_wholespace_w1/green_quadrature_repair.py \
            experiments/r3_wholespace_w1/elliptic_decomposition.py
      - name: Execute frozen elliptic decomposition gate
        run: python experiments/r3_wholespace_w1/elliptic_decomposition.py
      - name: Upload elliptic decomposition report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3-w1-elliptic-decomposition
          path: experiments/r3_wholespace_w1/results/W1_ELLIPTIC_DECOMPOSITION.json
          if-no-files-found: warn
