name: Lean 4 formalization

on:
  # Avoid immediately paying for the same full Lean build again after merging an
  # already-green PR to main. Keep the legacy direct-work branch covered.
  push:
    branches: ["lean4-formalization"]
    paths:
      - "Formal/**"
      - "lakefile.lean"
      - "lake-manifest.json"
      - "lean-toolchain"
      - "AGENTS.md"
      - "FORMAL_SCOPE.md"
      - ".github/pull_request_template.md"
      - ".github/workflows/lean.yml"
  # Required branch-protection checks must be emitted for every PR to main.
  # Do not add a paths filter here, otherwise documentation-only PRs can leave
  # the required check permanently pending.
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# A new push to the same PR makes its previous build obsolete. Cancelling that
# run prevents hosted minutes from being spent on a result that cannot be merged.
concurrency:
  group: lean-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject proof holes and local axioms
        shell: bash
        run: |
          set -euo pipefail

          if grep -RInE --include='*.lean' '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' Formal; then
            echo 'ERROR: proof hole token detected under Formal/.' >&2
            exit 1
          fi

          if grep -RInE --include='*.lean' '^[[:space:]]*(axiom|opaque)[[:space:]]' Formal; then
            echo 'ERROR: local axiom/opaque declaration detected under Formal/.' >&2
            exit 1
          fi

      # lean-action reads lean-toolchain, obtains the mathlib cache, runs the
      # same default `lake build`, and caches `.lake` for compatible later runs.
      - name: Build with cached Lean and Lake state
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: true
