name: Lean 4 formalization

on:
  push:
    branches: ["main", "lean4-formalization"]
    paths:
      - "Formal/**"
      - "lakefile.lean"
      - "lake-manifest.json"
      - "lean-toolchain"
      - "AGENTS.md"
      - "FORMAL_SCOPE.md"
      - ".github/pull_request_template.md"
      - ".github/workflows/lean.yml"
  # Required branch-protection checks must be emitted for every PR to main.
  # Do not add a paths filter here, otherwise documentation-only PRs can leave
  # the required check permanently pending.
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject proof holes and local axioms
        shell: bash
        run: |
          set -euo pipefail

          if grep -RInE --include='*.lean' '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' Formal; then
            echo 'ERROR: proof hole token detected under Formal/.' >&2
            exit 1
          fi

          if grep -RInE --include='*.lean' '^[[:space:]]*(axiom|opaque)[[:space:]]' Formal; then
            echo 'ERROR: local axiom/opaque declaration detected under Formal/.' >&2
            exit 1
          fi

      - name: Install Elan and pinned Lean toolchain
        shell: bash
        run: |
          set -euxo pipefail

          # elan-init downloads the Elan release tarball from GitHub Releases.
          # Treat transient 5xx/network failures as infrastructure noise rather
          # than immediately failing the formalization build.
          for attempt in 1 2 3 4 5; do
            if curl --retry 3 --retry-all-errors --retry-delay 2 \
                https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y; then
              break
            fi

            if [ "$attempt" -eq 5 ]; then
              echo "ERROR: Elan installation failed after ${attempt} attempts." >&2
              exit 1
            fi

            sleep $((attempt * 5))
          done

          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
          "$HOME/.elan/bin/lake" --version

      - name: Resolve Lake dependencies
        run: lake update

      - name: Fetch mathlib cache
        run: lake exe cache get

      - name: Build formalization and print axiom audit
        run: lake build
