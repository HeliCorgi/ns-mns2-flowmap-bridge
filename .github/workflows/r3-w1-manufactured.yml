name: R3 W1 manufactured short-time gate

on:
  pull_request:
    branches: ["research/r3-axisym-wholespace-w1-preflight"]
    paths:
      - "experiments/r3_wholespace_w1/manufactured_short_time.py"
      - "docs/gates/R3_AXISYM_WHOLESPACE_W1_MANUFACTURED_*.md"
      - ".github/workflows/r3-w1-manufactured.yml"
  workflow_dispatch:

concurrency:
  group: r3-w1-manufactured-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manufactured-short-time:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numerical dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile manufactured gate
        run: python -m py_compile experiments/r3_wholespace_w1/manufactured_short_time.py

      - name: Execute frozen manufactured gate
        run: python experiments/r3_wholespace_w1/manufactured_short_time.py

      - name: Upload manufactured report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3-w1-manufactured-short-time
          path: experiments/r3_wholespace_w1/results/W1_MANUFACTURED_SHORT_TIME.json
          if-no-files-found: warn
