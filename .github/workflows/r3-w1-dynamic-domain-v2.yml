name: R3 W1 early dynamic-domain audit v2

on:
  pull_request:
    branches: ["research/r3-axisym-wholespace-w1-green-quadrature-repair"]
    paths:
      - "experiments/r3_wholespace_w1/manufactured_short_time.py"
      - "experiments/r3_wholespace_w1/green_quadrature_repair.py"
      - "experiments/r3_wholespace_w1/dynamic_domain_audit_v2.py"
      - "docs/gates/R3_AXISYM_WHOLESPACE_W1_DYNAMIC_DOMAIN_V2_*.md"
      - ".github/workflows/r3-w1-dynamic-domain-v2.yml"
  workflow_dispatch:

concurrency:
  group: r3-w1-dynamic-domain-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dynamic-domain-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numerical dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile dynamic-domain v2 gate
        run: |
          python -m py_compile \
            experiments/r3_wholespace_w1/manufactured_short_time.py \
            experiments/r3_wholespace_w1/green_quadrature_repair.py \
            experiments/r3_wholespace_w1/dynamic_domain_audit_v2.py

      - name: Execute frozen dynamic-domain v2 gate
        run: python experiments/r3_wholespace_w1/dynamic_domain_audit_v2.py

      - name: Upload dynamic-domain v2 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3-w1-dynamic-domain-audit-v2
          path: experiments/r3_wholespace_w1/results/W1_DYNAMIC_DOMAIN_AUDIT_V2.json
          if-no-files-found: warn
