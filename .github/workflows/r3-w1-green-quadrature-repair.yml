name: R3 W1 Green quadrature repair

on:
  pull_request:
    branches: ["research/r3-axisym-wholespace-w1-manufactured-v2"]
    paths:
      - "experiments/r3_wholespace_w1/manufactured_short_time.py"
      - "experiments/r3_wholespace_w1/green_quadrature_repair.py"
      - "docs/gates/R3_AXISYM_WHOLESPACE_W1_GREEN_QUADRATURE_REPAIR_*.md"
      - ".github/workflows/r3-w1-green-quadrature-repair.yml"
  workflow_dispatch:

concurrency:
  group: r3-w1-green-quadrature-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  green-quadrature-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numerical dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Green quadrature repair gate
        run: |
          python -m py_compile \
            experiments/r3_wholespace_w1/manufactured_short_time.py \
            experiments/r3_wholespace_w1/green_quadrature_repair.py

      - name: Execute frozen Green quadrature repair gate
        run: python experiments/r3_wholespace_w1/green_quadrature_repair.py

      - name: Upload Green quadrature repair report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3-w1-green-quadrature-repair
          path: experiments/r3_wholespace_w1/results/W1_GREEN_QUADRATURE_REPAIR.json
          if-no-files-found: warn
